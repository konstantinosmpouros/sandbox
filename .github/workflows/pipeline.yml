# CI/CD for the sandbox runner. Four jobs:
#   test     unit tests + shellcheck of the deploy script (every push and PR)
#   spike    build the image natively on ARM64 (Dennis: Ampere A1, no /dev/kvm)
#            and on x86, then run spike/run_spike.sh under --privileged:
#            containment checks + the file-making workload under runc and runsc
#   release  push to main that changed docker-compose-denis.yaml, or Run
#            workflow: build on ARM64, re-run the spike against that exact
#            image, Trivy (fixable CRITICAL blocks), push to GHCR, verify the
#            package is private. An already-published tag is skipped.
#   deploy   after release, same trigger, owner only: SSH to Dennis with a
#            forced-command key that can only run /opt/deploy/sandbox.sh <sha>
#            (deploy/dennis-deploy.sh): checkout → compose pull + up -d → wait
#            for the healthcheck (CLAUDE.md § CD to Dennis).
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            runner/requirements.txt
            tests/requirements.txt

      - name: Install + test
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r runner/requirements.txt -r tests/requirements.txt
          .venv/bin/python -m pytest

      # shellcheck is preinstalled on GitHub's Ubuntu runners.
      - name: shellcheck the deploy script
        run: shellcheck deploy/dennis-deploy.sh

  spike:
    name: gVisor spike on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # ARM64 is the one that matters (Dennis); x86 is the comparison.
        runner: [ubuntu-24.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Host
        run: |
          uname -a
          nproc
          ls -l /dev/kvm 2>/dev/null || echo "/dev/kvm: absent"

      # Built from the project root: runner/Dockerfile also COPYs box/ and spike/.
      - name: Build the image
        run: docker build -f runner/Dockerfile -t sandbox-runner .

      - name: Run the spike
        run: |
          mkdir -p results
          docker run --rm --privileged -v "$PWD/results:/results" sandbox-runner /opt/spike/run_spike.sh

      - name: Summary
        if: always()
        run: cat results/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-spike-${{ matrix.runner }}
          path: results/

  release:
    name: release
    needs: [test, spike]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm # Dennis is ARM64: native build, no QEMU
    timeout-minutes: 60
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      deploy: ${{ steps.changes.outputs.deploy }}
    env:
      COMPOSE_FILE: docker-compose-denis.yaml
      TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0 # full history for the release diff below

      # A change to docker-compose-denis.yaml on main is a release. Diffed with
      # git: Actions' push payload has no file lists.
      - name: Is this a release? (docker-compose-denis.yaml changed)
        id: release
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          release=false
          if [ "$EVENT" = workflow_dispatch ]; then
            release=true
          elif [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then
            if [ -z "$PUSH_BEFORE" ] || ! git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
              release=true # no usable base: can't tell, so don't skip a release
            elif ! git diff --quiet "$PUSH_BEFORE" "$GITHUB_SHA" -- "$COMPOSE_FILE"; then
              release=true
            fi
          fi
          echo "release=$release" | tee -a "$GITHUB_OUTPUT"

      # Deploy when a deployed file changed on main (git diff of the push
      # range), or on Run workflow from main. Same step in mcp_gateway.
      - name: Deploy? (a deployed file changed on main)
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          DEPLOY_PATHS: docker-compose-denis.yaml
        run: |
          read -ra paths <<<"$DEPLOY_PATHS"
          deploy=false
          if [ "$REF" = refs/heads/main ]; then
            if [ "$EVENT" = workflow_dispatch ]; then
              deploy=true
            elif [ "$EVENT" = push ]; then
              if [ -z "$PUSH_BEFORE" ] || ! git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                deploy=true # no usable base: can't tell, so don't skip a deploy
              elif ! git diff --quiet "$PUSH_BEFORE" "$GITHUB_SHA" -- "${paths[@]}"; then
                deploy=true
              fi
            fi
          fi
          echo "deploy=$deploy" | tee -a "$GITHUB_OUTPUT"

      # Fail closed: only the repository owner can ship to production.
      - name: Only the repository owner can release
        if: steps.release.outputs.release == 'true'
        env:
          ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$ACTOR" != "$OWNER" ]; then
            echo "::error::Releases are started by $OWNER only (this run was started by $ACTOR)."
            exit 1
          fi

      - name: The release tag
        id: tag
        if: steps.release.outputs.release == 'true'
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sandbox_runner"
          lines=$(grep -E "^[[:space:]]+image:[[:space:]]+${repo}:" "$COMPOSE_FILE" || true)
          count=$(printf '%s\n' "$lines" | grep -c . || true)
          if [ "$count" != "1" ]; then
            echo "::error::$COMPOSE_FILE must name exactly one '$repo:vX.Y.Z' image (found $count)"
            exit 1
          fi
          tag=$(printf '%s' "${lines##*:}" | tr -d '[:space:]')
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$tag' is not a vX.Y.Z release tag"
            exit 1
          fi
          { echo "tag=$tag"; echo "image=$repo:$tag"; } | tee -a "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: steps.release.outputs.release == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # Tags are never overwritten: an already-published tag is skipped.
      - name: Already published?
        id: exists
        if: steps.release.outputs.release == 'true'
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          if out=$(docker manifest inspect "$IMAGE" 2>&1); then
            echo "::notice::$IMAGE is already published — nothing to build (tags are never overwritten)."
            echo "published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # "denied" counts as absent (the push would be refused too); anything
          # else fails rather than risk overwriting a published tag.
          if ! printf '%s' "$out" | grep -qiE "manifest unknown|no such manifest|not found|name unknown|denied"; then
            echo "::error::Could not tell whether $IMAGE exists: $out"
            exit 1
          fi
          echo "published=false" >> "$GITHUB_OUTPUT"

      - name: Build
        if: steps.release.outputs.release == 'true' && steps.exists.outputs.published == 'false'
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          docker build --pull --platform linux/arm64 \
            --build-arg APP_VERSION="$TAG" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.version="$TAG" \
            -f runner/Dockerfile -t "$IMAGE" .

      # Plan 11 phase 6: the gate is re-run against the exact image that ships.
      - name: Spike against the release image
        if: steps.release.outputs.release == 'true' && steps.exists.outputs.published == 'false'
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          mkdir -p results
          docker run --rm --privileged -v "$PWD/results:/results" "$IMAGE" /opt/spike/run_spike.sh
          cat results/summary.md >> "$GITHUB_STEP_SUMMARY"

      # Blocks fixable CRITICALs only.
      - name: Trivy scan
        if: steps.release.outputs.release == 'true' && steps.exists.outputs.published == 'false'
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --scanners vuln --severity CRITICAL --ignore-unfixed \
            --exit-code 1 --no-progress "$IMAGE"

      - name: Push
        if: steps.release.outputs.release == 'true' && steps.exists.outputs.published == 'false'
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          docker push "$IMAGE"
          echo "::notice::Published $IMAGE."

      # An anonymous pull must be refused — fails the release if the image is public.
      - name: Verify the image is private
        if: steps.release.outputs.release == 'true'
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          anon=$(mktemp -d)
          if out=$(DOCKER_CONFIG="$anon" docker manifest inspect "$IMAGE" 2>&1); then
            echo "::error::$IMAGE can be pulled WITHOUT credentials — it is PUBLIC. Make it private: github.com/users/$GITHUB_REPOSITORY_OWNER/packages/container/sandbox_runner/settings → Danger Zone → Change visibility."
            exit 1
          elif printf '%s' "$out" | grep -qiE "unauthorized|denied|authentication required"; then
            echo "$IMAGE: private ✓"
          else
            echo "::error::Could not verify $IMAGE is private: $out"
            exit 1
          fi

  # CD — deploys this commit to Dennis over SSH; builds nothing. The key in
  # DENNIS_SSH_KEY is pinned on Dennis to a forced command, so all it can do is
  # run /opt/deploy/sandbox.sh with this sha (deploy/dennis-deploy.sh).
  # Same job in sandbox and mcp_gateway; runbook: CLAUDE.md § CD to Dennis.
  deploy:
    name: deploy
    needs: [release]
    # Only this repo (never a fork) and only the owner; pull requests never get
    # here (`deploy` is true only for push / Run workflow on main).
    if: >-
      needs.release.outputs.deploy == 'true'
      && github.repository == 'konstantinosmpouros/sandbox'
      && github.actor == github.repository_owner
    # Secrets scoped to the `production` environment (main only, no reviewers):
    # only this job, on main, can read the deploy key. No approval step.
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: deploy-dennis
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      # Fail closed: only the repository owner can ship to production (also
      # covers a re-run started by someone else).
      - name: Only the repository owner can deploy
        env:
          ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$ACTOR" != "$OWNER" ]; then
            echo "::error::Deploys are started by $OWNER only (this run was started by $ACTOR)."
            exit 1
          fi

      # The key and the pinned host key go to $RUNNER_TEMP with umask 077;
      # nothing here is echoed (no set -x).
      - name: Write the SSH key and the pinned host key
        env:
          SSH_HOST: ${{ secrets.DENNIS_SSH_HOST }}
          SSH_USER: ${{ secrets.DENNIS_SSH_USER }}
          SSH_KEY: ${{ secrets.DENNIS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DENNIS_SSH_KNOWN_HOSTS }}
        run: |
          missing=""
          [ -n "$SSH_HOST" ] || missing="$missing DENNIS_SSH_HOST"
          [ -n "$SSH_USER" ] || missing="$missing DENNIS_SSH_USER"
          [ -n "$SSH_KEY" ] || missing="$missing DENNIS_SSH_KEY"
          [ -n "$SSH_KNOWN_HOSTS" ] || missing="$missing DENNIS_SSH_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "::error::Repository secret(s) not set:$missing (Settings → Secrets and variables → Actions → Repository secrets)."
            exit 1
          fi
          umask 077
          dir="$RUNNER_TEMP/dennis-ssh"
          mkdir -p "$dir"
          printf '%s\n' "$SSH_KEY" > "$dir/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$dir/known_hosts"

      # The forced command ignores everything but $SSH_ORIGINAL_COMMAND (the
      # sha) and prints one line per step; its exit code is this step's.
      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.DENNIS_SSH_HOST }}
          SSH_USER: ${{ secrets.DENNIS_SSH_USER }}
        run: |
          dir="$RUNNER_TEMP/dennis-ssh"
          ssh -T \
            -i "$dir/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$dir/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "$SSH_USER@$SSH_HOST" "$GITHUB_SHA"

      - name: Remove the SSH key
        if: always()
        run: rm -rf "$RUNNER_TEMP/dennis-ssh"
